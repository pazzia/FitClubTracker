name: Android CI

# Billing note: the free plan has 2000 runner minutes a month and every job is rounded up to a
# whole minute, so the workflow runs as one job and skips changes that cannot affect the APK.
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**', '.gitignore', 'LICENSE' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**', '.gitignore', 'LICENSE' ]
  workflow_dispatch:
    inputs:
      regenerate_contours:
        description: 'Пересчитать контуры фото заново (8 параллельных задач, долго)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only on manual request: normally the build job restores the verified contours itself.
  contours:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_contours
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check mask recipe
        id: recipe
        run: |
          if [ -f app/src/main/assets/exercise_masks/whole-objects-v2 ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Check compatibility with previously verified contours
        id: reuse
        if: steps.recipe.outputs.ready != 'true'
        shell: bash
        run: |
          if [ "$(git hash-object scripts/prepare_semantic_masks.py)" = "646aaaf41a066893ec22e1e4b81694e9a67e84f7" ] &&
             [ "$(git hash-object scripts/assemble_release_masks.py)" = "1eaf3455f3093839b9c7c899b8308a2e74b988aa" ] &&
             [ "$(git hash-object scripts/validate_exercise_masks.py)" = "45ae813103eed8823d7c94c6d6921ac8c23d2aee" ] &&
             [ "$(git hash-object app/src/main/assets/free_exercise_db/photos.sha256)" = "0956503f9f5d767f44781940e8896f9dd25d68e9" ] &&
             [ "$(git rev-parse HEAD:app/src/main/assets/exercise_masks)" = "afb8bfe4445d5caf7d17f7ab4bb08f0758b6ff1b" ]; then
            echo 'compatible=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore verified contour shard
        id: reused_masks
        if: steps.reuse.outputs.compatible == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37449786439
          name: exercise-contours-${{ matrix.shard }}
          path: app/src/main/assets/exercise_masks/
      - name: Restore verified shard provenance
        id: reused_report
        if: steps.reuse.outputs.compatible == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37449786439
          name: contour-report-${{ matrix.shard }}
          path: contour-reports/
      - uses: actions/setup-python@v5
        if: steps.recipe.outputs.ready != 'true' && !(steps.reused_masks.outcome == 'success' && steps.reused_report.outcome == 'success')
        with:
          python-version: '3.11'
      - name: Install pinned segmentation dependencies
        if: steps.recipe.outputs.ready != 'true' && !(steps.reused_masks.outcome == 'success' && steps.reused_report.outcome == 'success')
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.44.2 huggingface-hub==0.24.7 numpy==1.26.4 Pillow==11.0.0 opencv-python-headless==4.10.0.84 timm==1.0.9
          pip install git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2
      - name: Segment athlete and whole active equipment
        if: steps.recipe.outputs.ready != 'true' && !(steps.reused_masks.outcome == 'success' && steps.reused_report.outcome == 'success')
        run: python3 scripts/prepare_semantic_masks.py --shard ${{ matrix.shard }} --shards 8
      # Shards travel to the build job through the Actions cache, not artifacts:
      # the cache has its own 10 GB limit and does not count against the account's artifact storage quota.
      - name: Stage shard for the build job
        if: steps.recipe.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          masks=".gradle/prepared-contour-shards/masks/exercise-contours-${{ matrix.shard }}"
          reports=".gradle/prepared-contour-shards/reports/contour-report-${{ matrix.shard }}"
          mkdir -p "$masks" "$reports"
          cp -a app/src/main/assets/exercise_masks/. "$masks/"
          cp contour-reports/semantic-${{ matrix.shard }}.json "$reports/"
      - name: Hand shard to the build job
        if: steps.recipe.outputs.ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-${{ matrix.shard }}

  build:
    env:
      ORG_GRADLE_PROJECT_fitclubExperimental: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
      FITCLUB_BUILD_NUMBER: ${{ github.run_number }}
      FITCLUB_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FITCLUB_BRANCH: ${{ github.head_ref || github.ref_name }}
    needs: contours
    if: ${{ !cancelled() && needs.contours.result != 'failure' && github.head_ref != 'fork/anatomy-catalog-0.9.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write lets main builds publish the APK as a GitHub Release.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Usual path: download all eight verified shards from the reference run in this one job.
      - name: Check compatibility with previously verified contours
        id: reuse
        if: needs.contours.result == 'skipped' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        shell: bash
        run: |
          if [ "$(git hash-object scripts/prepare_semantic_masks.py)" = "646aaaf41a066893ec22e1e4b81694e9a67e84f7" ] &&
             [ "$(git hash-object scripts/assemble_release_masks.py)" = "1eaf3455f3093839b9c7c899b8308a2e74b988aa" ] &&
             [ "$(git hash-object scripts/validate_exercise_masks.py)" = "45ae813103eed8823d7c94c6d6921ac8c23d2aee" ] &&
             [ "$(git hash-object app/src/main/assets/free_exercise_db/photos.sha256)" = "0956503f9f5d767f44781940e8896f9dd25d68e9" ] &&
             [ "$(git rev-parse HEAD:app/src/main/assets/exercise_masks)" = "afb8bfe4445d5caf7d17f7ab4bb08f0758b6ff1b" ]; then
            echo 'compatible=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Contours need regenerating::Mask inputs changed. Run the workflow manually with «Пересчитать контуры фото заново»."
            exit 1
          fi

      - name: Restore verified contour shards
        if: steps.reuse.outputs.compatible == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37449786439
          pattern: exercise-contours-*
          path: .gradle/prepared-contour-shards/masks/

      - name: Restore verified shard provenance
        if: steps.reuse.outputs.compatible == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37449786439
          pattern: contour-report-*
          path: .gradle/prepared-contour-shards/reports/

      - name: Restore contour shard 0
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-0
          fail-on-cache-miss: true

      - name: Restore contour shard 1
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-1
          fail-on-cache-miss: true

      - name: Restore contour shard 2
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-2
          fail-on-cache-miss: true

      - name: Restore contour shard 3
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-3
          fail-on-cache-miss: true

      - name: Restore contour shard 4
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-4
          fail-on-cache-miss: true

      - name: Restore contour shard 5
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-5
          fail-on-cache-miss: true

      - name: Restore contour shard 6
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-6
          fail-on-cache-miss: true

      - name: Restore contour shard 7
        if: needs.contours.result == 'success' && hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        uses: actions/cache/restore@v4
        with:
          path: .gradle/prepared-contour-shards
          key: contour-shard-${{ github.run_id }}-7
          fail-on-cache-miss: true

      - name: Assemble verified contours without overlapping writes
        if: hashFiles('app/src/main/assets/exercise_masks/whole-objects-v2') == ''
        run: |
          python3 -m pip install Pillow==11.0.0
          python3 scripts/assemble_release_masks.py
          touch app/src/main/assets/exercise_masks/whole-objects-v2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep debug signing key between builds
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: fitclub-debug-signing-v2


      - name: Restore permanent signing key when configured
        env:
          FITCLUB_DEBUG_KEYSTORE_BASE64: ${{ secrets.FITCLUB_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("FITCLUB_DEBUG_KEYSTORE_BASE64", "").strip()
          if encoded:
              target = Path.home() / ".android" / "debug.keystore"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
              target.chmod(0o600)
          PY

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey
          echo "FITCLUB_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Save debug signing key before build
        if: steps.signing-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: fitclub-debug-signing-v2

      - name: Set up Android 34 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # В репозитории нет gradle-wrapper.jar, поэтому Gradle ставится этим шагом.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify released mask hashes, dimensions and foreground/background
        run: |
          set -o pipefail
          python3 -m pip install Pillow==11.0.0
          gradle :app:prepareExercisePhotos --stacktrace 2>&1 | tee build-photos.log
          python3 scripts/validate_exercise_masks.py 2>&1 | tee -a build-photos.log

      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee build-test.log
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          tests = sum(int(r.get('tests', 0)) for r in roots)
          failures = sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in roots)
          print(f'Test report: {tests} tests, {failures} failures/errors')
          if not tests or failures:
              raise SystemExit('Missing or failing test reports')
          PY

      - name: Build debug APK
        run: |
          set -o pipefail
          FITCLUB_DEBUG_KEYSTORE_PATH="$HOME/.android/debug.keystore" gradle assembleDebug --stacktrace 2>&1 | tee build-apk.log

      # Compiler errors and failing tests become annotations on the pull request, so they can be read without the raw log.
      - name: Report build and test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          def emit(title, lines):
              if lines:
                  body = "%0A".join(l.replace("%", "%25").replace("\r", "").replace("\n", " ")[:400] for l in lines[:60])
                  print(f"::error title={title}::{body}")
          compile_errors = []
          tail = []
          if Path("build-photos.log").exists():
              tail = [l for l in Path("build-photos.log").read_text(errors="replace").splitlines() if l.strip()][-40:]
          emit("Photo preparation output (last lines)", tail)
          for log in ("build-test.log", "build-apk.log", "build-photos.log"):
              path = Path(log)
              if path.exists():
                  for line in path.read_text(errors="replace").splitlines():
                      if re.match(r"^e: ", line) or "error:" in line and ".kt" in line:
                          compile_errors.append(re.sub(r"file://.*?/app/src/", "app/src/", line))
          emit("Kotlin compile errors", compile_errors)
          failures = []
          for report in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      message = (problem.get("message") or problem.text or "").strip().splitlines()
                      failures.append(f"{case.get('classname','').split('.')[-1]}.{case.get('name')}: {' | '.join(message[:3])}")
          emit("Failing unit tests", failures)
          PY

      - name: Verify distribution package and version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/debug/output-metadata.json').read_text())
          experimental = os.environ['ORG_GRADLE_PROJECT_fitclubExperimental'] == 'true'
          expected = 'com.fitclub.tracker.experimental' if experimental else 'com.fitclub.tracker'
          assert metadata['applicationId'] == expected, metadata
          element = metadata['elements'][0]
          assert element['versionName'] == ('0.9.5-test' if experimental else '0.9.5'), element
          assert element['versionCode'] == 28, element
          print(f"Distribution verified: {expected}, {element['versionName']} ({element['versionCode']})")
          PY

      - name: Verify APK signing identity
        run: '"$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'

      - name: Name APK using version and build number
        id: apk
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          apk_dir = Path("app/build/outputs/apk/debug")
          metadata = json.loads((apk_dir / "output-metadata.json").read_text())
          elements = metadata["elements"]
          if len(elements) != 1:
              raise RuntimeError("Expected a single debug APK")
          element = elements[0]
          version = re.sub(r"[^A-Za-z0-9._-]", "-", element["versionName"])
          name = f"FitClub-v{version}-build{os.environ['GITHUB_RUN_NUMBER']}-debug"
          target = Path("dist") / f"{name}.apk"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(apk_dir / element["outputFile"], target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={name}\n")
              output.write(f"path={target.as_posix()}\n")
          print(f"APK: {target.name}")
          PY

      # Main builds ship the APK as a GitHub Release: releases do not count against the
      # artifact storage quota, and the download link is stable.
      - name: Publish APK as a GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.apk.outputs.name }}"
          version="$(sed -E 's/^FitClub-v([^-]+(-test)?)-build.*/\1/' <<< "$name")"
          tag="v${version}-build${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "FitClub ${version} · build ${GITHUB_RUN_NUMBER}" \
            --notes "Подписанный debug APK из main (${GITHUB_SHA::7}). Что нового — в README, раздел «Что изменено в ${version}»."
          printf 'APK release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        id: upload_apk
        if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
        # A full artifact quota must not hide a green build; the next step shows when the APK was not kept.
        continue-on-error: true

      - name: Warn when the APK could not be stored
        if: steps.upload_apk.outcome == 'failure'
        run: echo "::warning title=APK not stored::Build and tests passed, but the APK upload failed (artifact storage quota?). Free space in Settings → Actions and re-run."

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3


      - name: Upload rendered photo previews
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: contour-visual-checks
          path: app/build/contour-qa/
          if-no-files-found: ignore
          retention-days: 1


      - name: Upload preview UI screens
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-screens
          path: app/build/ui-preview/
          if-no-files-found: ignore
          retention-days: 2



