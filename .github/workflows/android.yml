name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fitclub-debug-signing-v1


      - name: Restore permanent signing key when configured
        env:
          FITCLUB_DEBUG_KEYSTORE_BASE64: ${{ secrets.FITCLUB_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("FITCLUB_DEBUG_KEYSTORE_BASE64", "").strip()
          if encoded:
              target = Path.home() / ".android" / "debug.keystore"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
              target.chmod(0o600)
          PY

      - name: Require the approved signing key
        run: python3 tools/check_debug_signing.py --keystore "$HOME/.android/debug.keystore"

      - name: Set up Android 34 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # В репозитории нет gradle-wrapper.jar, поэтому Gradle ставится этим шагом.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing identity
        run: python3 tools/check_debug_signing.py --apk app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Name APK using version and build number
        id: apk
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          apk_dir = Path("app/build/outputs/apk/debug")
          metadata = json.loads((apk_dir / "output-metadata.json").read_text())
          elements = metadata["elements"]
          if len(elements) != 1:
              raise RuntimeError("Expected a single debug APK")
          element = elements[0]
          version = re.sub(r"[^A-Za-z0-9._-]", "-", element["versionName"])
          name = f"FitClub-v{version}-build{os.environ['GITHUB_RUN_NUMBER']}-debug"
          target = Path("dist") / f"{name}.apk"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(apk_dir / element["outputFile"], target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={name}\n")
              output.write(f"path={target.as_posix()}\n")
          print(f"APK: {target.name}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
