name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download separate prepared mask shards
        if: hashFiles('app/src/main/assets/exercise_masks/manifest.json') == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37266915330
          pattern: exercise-contours-*
          path: .gradle/prepared-contour-shards/masks

      - name: Download shard provenance
        if: hashFiles('app/src/main/assets/exercise_masks/manifest.json') == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37266915330
          pattern: contour-report-*
          path: .gradle/prepared-contour-shards/reports

      - name: Assemble verified contours without overlapping writes
        if: hashFiles('app/src/main/assets/exercise_masks/manifest.json') == ''
        run: |
          python3 -m pip install Pillow==11.0.0
          python3 scripts/assemble_release_masks.py

      - name: Verify all released mask hashes
        run: python3 scripts/validate_exercise_masks.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Keep debug signing key between builds
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: fitclub-debug-signing-v2


      - name: Restore permanent signing key when configured
        env:
          FITCLUB_DEBUG_KEYSTORE_BASE64: ${{ secrets.FITCLUB_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("FITCLUB_DEBUG_KEYSTORE_BASE64", "").strip()
          if encoded:
              target = Path.home() / ".android" / "debug.keystore"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
              target.chmod(0o600)
          PY

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey
          echo "FITCLUB_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Save debug signing key before build
        if: steps.signing-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: fitclub-debug-signing-v2

      - name: Set up Android 34 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # В репозитории нет gradle-wrapper.jar, поэтому Gradle ставится этим шагом.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: |
          gradle testDebugUnitTest --stacktrace
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          roots = [ET.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          tests = sum(int(r.get('tests', 0)) for r in roots)
          failures = sum(int(r.get('failures', 0)) + int(r.get('errors', 0)) for r in roots)
          print(f'Test report: {tests} tests, {failures} failures/errors')
          if not tests or failures:
              raise SystemExit('Missing or failing test reports')
          PY

      - name: Build debug APK
        run: FITCLUB_DEBUG_KEYSTORE_PATH="$HOME/.android/debug.keystore" gradle assembleDebug --stacktrace

      - name: Verify APK signing identity
        run: '"$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'

      - name: Name APK using version and build number
        id: apk
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          apk_dir = Path("app/build/outputs/apk/debug")
          metadata = json.loads((apk_dir / "output-metadata.json").read_text())
          elements = metadata["elements"]
          if len(elements) != 1:
              raise RuntimeError("Expected a single debug APK")
          element = elements[0]
          version = re.sub(r"[^A-Za-z0-9._-]", "-", element["versionName"])
          name = f"FitClub-v{version}-build{os.environ['GITHUB_RUN_NUMBER']}-debug"
          target = Path("dist") / f"{name}.apk"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(apk_dir / element["outputFile"], target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name={name}\n")
              output.write(f"path={target.as_posix()}\n")
          print(f"APK: {target.name}")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Preserve verified release masks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FITCLUB_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/exercise_masks
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified 448 release contour assets'
            git push origin "HEAD:$FITCLUB_HEAD_BRANCH"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore


      - name: Upload rendered photo previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contour-visual-checks
          path: app/build/contour-qa/
          if-no-files-found: ignore
